<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Distribuciones">
<meta name="theme-color" content="#0a0a0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --board:#0a0a0a; --board-2:#181818; --board-3:#101010; --chalk:#eae6d9; --chalk-dim:#9db0af;
    --grid-line: rgba(234,230,217,0.055);
    --yellow:#e8c468; --coral:#e2725b;
    --coral-dim: rgba(226,114,91,0.22); --yellow-dim: rgba(232,196,104,0.22);
    --line: rgba(234,230,217,0.16);
    --sky:#7ec8e3; --sky-dim: rgba(126,200,227,0.22);
    --pink:#e68fb0; --pink-dim: rgba(230,143,176,0.22);
    --axis-strong: rgba(234,230,217,0.35); --axis-soft: rgba(234,230,217,0.3);
    --card-border: rgba(234,230,217,0.1);
    --card-bg: var(--board-2); --input-bg: rgba(0,0,0,0.28);
  }
  html[data-theme="light"]{
    --board:#ffffff; --board-2:#f4f2ee; --board-3:#ffffff; --chalk:#20241f; --chalk-dim:#5c6b62;
    --grid-line: rgba(20,24,20,0.05);
    --yellow:#c9962e; --coral:#e2725b;
    --coral-dim: rgba(226,114,91,0.16); --yellow-dim: rgba(201,150,46,0.3);
    --line: rgba(20,24,20,0.14);
    --sky:#0e7ba6; --sky-dim: rgba(14,123,166,0.16);
    --pink:#d5679a; --pink-dim: rgba(213,103,154,0.16);
    --axis-strong: rgba(20,24,20,0.35); --axis-soft: rgba(20,24,20,0.28);
    --card-border: rgba(20,24,20,0.1);
    --card-bg: linear-gradient(145deg, var(--board-2), var(--board-3)); --input-bg: rgba(0,0,0,0.1);
  }
  body, .card, .result-card, input, select, .pill, .segment button, .exam-overlay, .pin-box{
    transition: background-color .25s ease, color .25s ease, border-color .25s ease;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--board);
    color:var(--chalk); font-family:'Inter', sans-serif; min-height:100vh;
    padding:16px 16px 20px; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:440px;margin:0 auto;}
  .eyebrow{font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.16em; color:var(--chalk-dim); text-transform:uppercase; margin-bottom:6px;}
  .top-row{display:flex; align-items:center; justify-content:flex-end; gap:10px;}
  .dist-header-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .dist-header-row .label-row{margin:0;}
  .theme-toggle{width:34px; height:34px; border-radius:50%; border:1px solid var(--line); background:var(--board-2); color:var(--chalk); font-size:15px; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;}
  h1{font-family:'Fraunces', serif; font-weight:600; font-size:28px; margin:0 0 4px; letter-spacing:-0.01em;}
  .home-title{text-align:center; margin:18px 0 26px;}
  .dist-list{display:flex; flex-direction:column; gap:8px; margin-bottom:22px;}
  .dist-list-item{width:100%; text-align:center; background:var(--card-bg); border:1px solid var(--card-border); border-radius:10px; color:var(--chalk); font-family:'JetBrains Mono', monospace; font-size:14px; padding:13px; cursor:pointer;}
  .dist-list-item:active{border-color:var(--yellow); color:var(--yellow);}
  .exam-btn-slot{margin-bottom:8px;}

<script>
/* ---------------- tema (oscuro/claro) ---------------- */
var THEME_KEY='calc_distribuciones_theme_v1';
(function initTheme(){
  var saved=null;
  try{ saved=localStorage.getItem(THEME_KEY); }catch(e){}
  var theme = (saved==='light') ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', theme);
})();
function applyThemeIcon(){
  var theme=document.documentElement.getAttribute('data-theme');
  document.getElementById('themeToggle').textContent = (theme==='light') ? '☀️' : '🌙';
}

/* ---------------- núcleo matemático ---------------- */
function lgamma(x){
  var g=7;
  var c=[0.99999999999980993,676.5203681218851,-1259.1392167224028,771.32342877765313,-176.61502916214059,12.507343278686905,-0.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];
  if(x<0.5){ return Math.log(Math.PI/Math.sin(Math.PI*x)) - lgamma(1-x); }
  x-=1; var a=c[0]; var t=x+g+0.5;
  for(var i=1;i<g+2;i++){ a+=c[i]/(x+i); }
  return 0.5*Math.log(2*Math.PI)+(x+0.5)*Math.log(t)-t+Math.log(a);
}
function logChoose(n,k){ if(k<0||k>n||n<0) return -Infinity; return lgamma(n+1)-lgamma(k+1)-lgamma(n-k+1); }

function erf(x){
  var sign=x>=0?1:-1; x=Math.abs(x);
  var a1=0.254829592,a2=-0.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=0.3275911;
  var t=1/(1+p*x);
  var y=1-(((((a5*t+a4)*t)+a3)*t+a2)*t+a1)*t*Math.exp(-x*x);
  return sign*y;
}

function gammaSeries(a,x){
  if(x<=0) return 0;
  var gln=lgamma(a), ap=a, sum=1/a, del=sum;
  for(var n=1;n<=200;n++){ ap+=1; del*=x/ap; sum+=del; if(Math.abs(del)<Math.abs(sum)*1e-14) break; }
  return sum*Math.exp(-x+a*Math.log(x)-gln);
}
function gammaCF(a,x){
  var gln=lgamma(a); var b=x+1-a,c=1e300,d=1/b,h=d;
  for(var i=1;i<=200;i++){
    var an=-i*(i-a); b+=2;
    d=an*d+b; if(Math.abs(d)<1e-300) d=1e-300;
    c=b+an/c; if(Math.abs(c)<1e-300) c=1e-300;
    d=1/d; var del=d*c; h*=del;
    if(Math.abs(del-1)<1e-14) break;
  }
  return Math.exp(-x+a*Math.log(x)-gln)*h;
}
function gammaP(a,x){ if(x<0||a<=0) return 0; if(x===0) return 0; return x<a+1 ? gammaSeries(a,x) : 1-gammaCF(a,x); }

function betacf(x,a,b){
  var MAXIT=200,EPS=3e-14,FPMIN=1e-300;
  var qab=a+b,qap=a+1,qam=a-1;
  var c=1,d=1-qab*x/qap; if(Math.abs(d)<FPMIN) d=FPMIN; d=1/d; var h=d;
  for(var m=1;m<=MAXIT;m++){
    var m2=2*m;
    var aa=m*(b-m)*x/((qam+m2)*(a+m2));
    d=1+aa*d; if(Math.abs(d)<FPMIN) d=FPMIN;
    c=1+aa/c; if(Math.abs(c)<FPMIN) c=FPMIN;
    d=1/d; h*=d*c;
    aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));
    d=1+aa*d; if(Math.abs(d)<FPMIN) d=FPMIN;
    c=1+aa/c; if(Math.abs(c)<FPMIN) c=FPMIN;
    d=1/d; var del=d*c; h*=del;
    if(Math.abs(del-1)<EPS) break;
  }
  return h;
}
function betai(x,a,b){
  if(x<=0) return 0; if(x>=1) return 1;
  var bt=Math.exp(lgamma(a+b)-lgamma(a)-lgamma(b)+a*Math.log(x)+b*Math.log(1-x));
  return x<(a+1)/(a+b+2) ? bt*betacf(x,a,b)/a : 1-bt*betacf(1-x,b,a)/b;
}

function bisectGeneric(f,target,lo,hi,increasing,iters){
  for(var i=0;i<iters;i++){
    var mid=(lo+hi)/2, fm=f(mid);
    if(increasing){ if(fm<target) lo=mid; else hi=mid; } else { if(fm>target) lo=mid; else hi=mid; }
  }
  return (lo+hi)/2;
}

/* ---------------- distribuciones ---------------- */
function tCDF(t,df){ var x=df/(df+t*t); var ib=betai(x,df/2,0.5); return t>=0 ? 1-0.5*ib : 0.5*ib; }
function tPDF(t,df){ return Math.exp(lgamma((df+1)/2)-lgamma(df/2))/Math.sqrt(df*Math.PI)*Math.pow(1+t*t/df,-(df+1)/2); }
function chi2CDF(x,df){ return x<=0?0:gammaP(df/2,x/2); }
function chi2PDF(x,df){ return x<=0?0:Math.exp((df/2-1)*Math.log(x)-x/2-(df/2)*Math.log(2)-lgamma(df/2)); }
function fCDF(x,d1,d2){ if(x<=0) return 0; var xt=d1*x/(d1*x+d2); return betai(xt,d1/2,d2/2); }
function fPDF(x,d1,d2){ if(x<=0) return 0; return Math.exp(lgamma((d1+d2)/2)-lgamma(d1/2)-lgamma(d2/2)+(d1/2)*Math.log(d1/d2)+(d1/2-1)*Math.log(x)-((d1+d2)/2)*Math.log(1+d1*x/d2)); }

var DIST = {
  normal:{ type:'continuous', symmetric:true, defaultValue:1.96, valueLabel:'Valor de x',
    params:[{key:'mu',label:'μ (media)',default:0,step:0.1,alwaysFilled:true},{key:'sigma',label:'σ (desvío)',default:1,step:0.1,min:0.0001,alwaysFilled:true}],
    center:function(p){return p.mu;},
    cdf:function(x,p){ return 0.5*(1+erf((x-p.mu)/(p.sigma*Math.SQRT2))); },
    pdf:function(x,p){ return Math.exp(-0.5*Math.pow((x-p.mu)/p.sigma,2))/(p.sigma*Math.sqrt(2*Math.PI)); },
    bounds:function(p,tail){ return (tail==='central'||tail==='two') ? [p.mu, p.mu+60*p.sigma] : [p.mu-60*p.sigma, p.mu+60*p.sigma]; },
    nonneg:false
  },
  t:{ type:'continuous', symmetric:true, defaultValue:2.228, valueLabel:'Valor de t',
    params:[{key:'df',label:'g.l. (ν)',default:10,step:1,min:1,integer:true}],
    center:function(){return 0;},
    cdf:function(x,p){ return tCDF(x,p.df); }, pdf:function(x,p){ return tPDF(x,p.df); },
    bounds:function(p,tail){ return (tail==='central'||tail==='two') ? [0,2000] : [-2000,2000]; },
    nonneg:false
  },
  chi2:{ type:'continuous', symmetric:false, defaultValue:11.07, valueLabel:'Valor de χ²',
    params:[{key:'df',label:'g.l. (ν)',default:5,step:1,min:1,integer:true}],
    cdf:function(x,p){ return chi2CDF(x,p.df); }, pdf:function(x,p){ return chi2PDF(x,p.df); },
    bounds:function(p){ return [0, Math.max(1000,p.df*60+1000)]; },
    nonneg:true
  },
  f:{ type:'continuous', symmetric:false, defaultValue:3.33, valueLabel:'Valor de F',
    params:[{key:'df1',label:'g.l. (ν1)',default:5,step:1,min:1,integer:true},{key:'df2',label:'g.l. (ν2)',default:10,step:1,min:1,integer:true}],
    cdf:function(x,p){ return fCDF(x,p.df1,p.df2); }, pdf:function(x,p){ return fPDF(x,p.df1,p.df2); },
    bounds:function(){ return [0,1e6]; },
    nonneg:true
  },
  binomial:{ type:'discrete', defaultValue:12, valueLabel:'x (aciertos)',
    params:[{key:'n',label:'n (ensayos)',default:20,step:1,min:1,integer:true},{key:'pr',label:'p (éxito)',default:0.5,step:0.01,min:0,max:1}],
    pmf:function(k,p){ if(k<0||k>p.n) return 0; if(p.pr<=0) return k===0?1:0; if(p.pr>=1) return k===p.n?1:0; return Math.exp(logChoose(p.n,k)+k*Math.log(p.pr)+(p.n-k)*Math.log(1-p.pr)); },
    maxK:function(p){ return p.n; }
  },
  poisson:{ type:'discrete', defaultValue:6, valueLabel:'x (eventos)',
    params:[{key:'lambda',label:'λ (media)',default:4,step:0.1,min:0.0001}],
    pmf:function(k,p){ if(k<0) return 0; return Math.exp(-p.lambda+k*Math.log(p.lambda)-lgamma(k+1)); },
    maxK:function(p){ return Math.min(3000, Math.ceil(p.lambda+20*Math.sqrt(p.lambda)+50)); }
  },
  hyper:{ type:'discrete', defaultValue:5, valueLabel:'x (éxitos en muestra)',
    params:[{key:'N',label:'N (población)',default:50,step:1,min:1,integer:true},{key:'K',label:'K (éxitos en pob.)',default:20,step:1,min:0,integer:true},{key:'n',label:'n (muestra)',default:10,step:1,min:0,integer:true}],
    pmf:function(k,p){ return Math.exp(logChoose(p.K,k)+logChoose(p.N-p.K,p.n-k)-logChoose(p.N,p.n)); },
    maxK:function(p){ return Math.min(p.n,p.K); }
  }
};

/* ---------------- estado y utilidades ---------------- */
var state = { distKey:'normal', mode:'vp', tail:'left' };
var input = document.getElementById('mainInput');
function currentDist(){ return DIST[state.distKey]; }
function fmt(n,d){ if(!isFinite(n)) return n>0?'∞':'-∞'; return n.toFixed(d===undefined?4:d); }

function readParams(dist){
  var out={}; var incomplete=false;
  dist.params.forEach(function(pd){
    var el=document.getElementById('param_'+pd.key);
    var raw=((el&&el.value)||'').toString().trim();
    if(raw===''){
      if(!pd.alwaysFilled) incomplete=true;
      out[pd.key]=pd.default;
    } else {
      var v=parseFloat(raw.replace(',','.'));
      if(isNaN(v)) v=pd.default;
      if(pd.integer) v=Math.round(v);
      if(pd.min!==undefined) v=Math.max(pd.min,v);
      if(pd.max!==undefined) v=Math.min(pd.max,v);
      out[pd.key]=v;
    }
  });
  out.__incomplete=incomplete;
  return out;
}
function validateParams(distKey, p){
  if(distKey==='normal' && p.sigma<=0) return 'σ debe ser mayor a 0';
  if(distKey==='t' && p.df<1) return 'ν (g.l.) debe ser ≥ 1';
  if(distKey==='chi2' && p.df<1) return 'ν (g.l.) debe ser ≥ 1';
  if(distKey==='f' && (p.df1<1||p.df2<1)) return 'los g.l. deben ser ≥ 1';
  if(distKey==='binomial' && (p.n<1||p.pr<0||p.pr>1)) return 'n≥1 y p entre 0 y 1';
  if(distKey==='poisson' && p.lambda<=0) return 'λ debe ser mayor a 0';
  if(distKey==='hyper' && (p.N<1||p.K<0||p.n<0||p.K>p.N||p.n>p.N)) return 'se requiere N≥1, 0≤K≤N, 0≤n≤N';
  return null;
}
function buildParamsUI(dist){
  document.getElementById('paramsRow').innerHTML = dist.params.map(function(pd){
    var valAttr = pd.alwaysFilled ? (' value="'+pd.default+'"') : (' value="" placeholder="'+pd.default+'"');
    return '<div class="param-field"><label>'+pd.label+'</label><input id="param_'+pd.key+'" type="text" inputmode="decimal"'+valAttr+'></div>';
  }).join('');
  dist.params.forEach(function(pd){
    var el=document.getElementById('param_'+pd.key);
    el.addEventListener('input', function(){ render(); saveState(); });
    el.addEventListener('keydown', function(e){ if(e.key==='Enter'){ el.blur(); } });
  });
}

function discreteCDF(dist,params,k){
  if(k<0) return 0;
  var mk=dist.maxK(params), kk=Math.min(k,mk), s=0;
  for(var i=0;i<=kk;i++){ s+=dist.pmf(i,params); }
  return Math.min(1,s);
}

function computeTailProb(dist,params,x,tail){
  if(dist.type==='discrete'){
    var k=Math.round(x);
    if(tail==='left') return discreteCDF(dist,params,k);
    if(tail==='right') return 1-discreteCDF(dist,params,k-1);
    if(tail==='exact') return dist.pmf(k,params);
  } else {
    var cdf=function(v){ return dist.cdf(v,params); };
    if(tail==='left') return cdf(x);
    if(tail==='right') return 1-cdf(x);
    var c=dist.center(params);
    var d=Math.abs(x-c);
    if(tail==='central') return cdf(c+d)-cdf(c-d);
    if(tail==='two') return 1-(cdf(c+d)-cdf(c-d));
  }
}

function invertValue(dist,params,p,tail){
  if(dist.type==='discrete'){
    var mk=dist.maxK(params);
    if(tail==='left'){
      var s=0; for(var k=0;k<=mk;k++){ s+=dist.pmf(k,params); if(s>=p-1e-9) return k; } return mk;
    } else {
      var s2=0; for(var k2=mk;k2>=0;k2--){ s2+=dist.pmf(k2,params); if(s2>=p-1e-9) return k2; } return 0;
    }
  } else {
    var bounds=dist.bounds(params,tail);
    var increasing=(tail==='left'||tail==='central');
    var f=function(x){ return computeTailProb(dist,params,x,tail); };
    return bisectGeneric(f,p,bounds[0],bounds[1],increasing,90);
  }
}

function chartDomain(dist,params){
  var b=dist.bounds(params,'left');
  var f=function(x){ return dist.cdf(x,params); };
  var lo=bisectGeneric(f,0.001,b[0],b[1],true,80);
  var hi=bisectGeneric(f,0.999,b[0],b[1],true,80);
  if(dist.nonneg){
    lo=0;
  } else if(dist.symmetric){
    var c=dist.center(params);
    var halfWidth=Math.max(c-lo, hi-c);
    lo=c-halfWidth; hi=c+halfWidth;
  }
  if(hi-lo<1e-6) hi=lo+1;
  return [lo,hi];
}

function clearZlines(){ document.getElementById('zlines').innerHTML=''; }
function drawZlineAt(px,label){
  document.getElementById('zlines').innerHTML += '<line class="zline" x1="'+px+'" y1="10" x2="'+px+'" y2="140"></line><text class="zlabel" x="'+px+'" y="10" text-anchor="middle">'+label+'</text>';
}

function renderContinuousChart(dist,params,tail,x){
  document.getElementById('barsGroup').innerHTML='';
  var dom=chartDomain(dist,params), xmin=dom[0], xmax=dom[1];
  var N=140, step=(xmax-xmin)/N, ymax=0, vals=[];
  for(var i=0;i<=N;i++){ var xx=xmin+i*step, yy=dist.pdf(xx,params); if(isFinite(yy)&&yy>ymax) ymax=yy; vals.push([xx,yy]); }
  ymax = ymax>0 ? ymax*1.08 : 1;
  function toX(v){ return 10+(v-xmin)/(xmax-xmin)*320; }
  function toY(v){ var yy=(v/ymax)*128; if(!isFinite(yy)) yy=128; return 140-Math.min(128,yy); }
  document.getElementById('curveLine').setAttribute('d','M'+vals.map(function(v){return toX(v[0])+","+toY(v[1]);}).join(' L'));

  function areaPath(a,b){
    a=Math.max(xmin,a); b=Math.min(xmax,b); if(b<=a) return '';
    var pts=[], st=(b-a)/60;
    for(var xx=a; xx<=b+1e-9; xx+=st){ pts.push(toX(xx)+","+toY(dist.pdf(xx,params))); }
    return 'M'+toX(a)+',140 L'+pts.join(' L')+' L'+toX(b)+',140 Z';
  }
  clearZlines();
  var shadeA='', shadeB='';
  if(x!==null && x!==undefined){
    if(tail==='left'){ shadeA=areaPath(xmin,x); drawZlineAt(toX(x), x.toFixed(4)); }
    else if(tail==='right'){ shadeA=areaPath(x,xmax); drawZlineAt(toX(x), x.toFixed(4)); }
    else {
      var c=dist.center(params), d=Math.abs(x-c);
      if(tail==='central'){ shadeA=areaPath(c-d,c+d); }
      else { shadeA=areaPath(xmin,c-d); shadeB=areaPath(c+d,xmax); }
      drawZlineAt(toX(c+d), (c+d).toFixed(4));
      drawZlineAt(toX(c-d), (c-d).toFixed(4));
    }
  }
  document.getElementById('shadeA').setAttribute('d',shadeA);
  document.getElementById('shadeB').setAttribute('d',shadeB);

  var html='';
  for(var ti=0; ti<=4; ti++){
    var tv=xmin+(xmax-xmin)*ti/4, px=toX(tv);
    var tvLabel=tv.toFixed(1); if(tvLabel.slice(-2)==='.0') tvLabel=tvLabel.slice(0,-2);
    html+='<line class="tick" x1="'+px+'" y1="140" x2="'+px+'" y2="145"></line><text class="tick-label" x="'+px+'" y="156" text-anchor="middle">'+tvLabel+'</text>';
  }
  document.getElementById('ticks').innerHTML=html;
}

function renderDiscreteChart(dist,params,tail,x){
  document.getElementById('curveLine').setAttribute('d','');
  document.getElementById('shadeA').setAttribute('d','');
  document.getElementById('shadeB').setAttribute('d','');
  clearZlines();
  var hasX=(x!==null && x!==undefined);
  var mk=dist.maxK(params), xr=hasX?Math.round(x):null, lo=0, hi=mk;
  if(mk>40){
    var center=hasX?Math.max(0,Math.min(mk,xr)):Math.round(mk/2);
    lo=Math.max(0,center-15); hi=Math.min(mk,center+15);
    if(hi-lo<30){ if(lo===0) hi=Math.min(mk,30); else if(hi===mk) lo=Math.max(0,mk-30); }
  }
  var pairs=[], maxP=0;
  for(var k=lo;k<=hi;k++){ var v=dist.pmf(k,params); pairs.push([k,v]); if(v>maxP) maxP=v; }
  maxP = maxP>0 ? maxP*1.15 : 1;
  var n=pairs.length, barW=300/n;
  function hlFn(k){
    if(!hasX) return false;
    if(tail==='left') return k<=xr;
    if(tail==='right') return k>=xr;
    return k===xr;
  }
  var bars='', ticks='', labelEvery=Math.max(1,Math.ceil(n/16));
  pairs.forEach(function(pair,idx){
    var k=pair[0], v=pair[1], h=(v/maxP)*128;
    var xpix=20+idx*barW+barW*0.12, w=barW*0.76, ypix=140-h;
    bars+='<rect class="bar'+(hlFn(k)?' hl':'')+'" x="'+xpix+'" y="'+ypix+'" width="'+w+'" height="'+h+'" rx="1.5"></rect>';
    if(idx%labelEvery===0){ ticks+='<text class="tick-label" x="'+(20+idx*barW+barW/2)+'" y="152" text-anchor="middle">'+k+'</text>'; }
  });
  document.getElementById('barsGroup').innerHTML=bars;
  document.getElementById('ticks').innerHTML=ticks;
}

var tailFormulas={ left:'P(X ≤ x)', right:'P(X ≥ x)', exact:'P(X = x)', central:'P(c−d < X < c+d)', two:'P(|X−c| > d)' };
var tailPlain={ left:'Izquierda', right:'Derecha', exact:'Exacta', central:'Central', two:'Dos colas' };
function formulaText(dist,tail){ return tailPlain[tail]; }

function tailNotationMap(sym){
  var big='<span class="sym-big">'+sym+'</span>';
  var small='<span class="sym-small">'+sym+'</span>';
  return {
    left:'P('+big+' ≤ '+small+')',
    right:'P('+big+' ≥ '+small+')',
    central:'P(−|'+small+'| ≤ '+big+' ≤ |'+small+'|)',
    two:'2P('+big+' ≥ |'+small+'|)'
  };
}
function updateTailNotations(sym){
  if(!sym) return;
  var map=tailNotationMap(sym);
  Array.from(document.querySelectorAll('#tailPills .math[data-notation]')).forEach(function(el){
    el.innerHTML = map[el.getAttribute('data-notation')] || '';
  });
}
function buildTailPills(){
  var dist=currentDist(), opts;
  if(dist.type==='discrete'){
    opts=[{k:'left',l:'Izquierda',m:'P(X≤x)'},{k:'right',l:'Derecha',m:'P(X≥x)'},{k:'exact',l:'Exacta',m:'P(X=x)'}];
    if(state.mode==='pv') opts=opts.filter(function(o){return o.k!=='exact';});
  } else if(dist.symmetric){
    opts=[{k:'left',l:'Izquierda'},{k:'right',l:'Derecha'},{k:'central',l:'Central'},{k:'two',l:'Dos colas'}];
  } else {
    opts=[{k:'left',l:'Izquierda'},{k:'right',l:'Derecha'}];
  }
  if(!opts.some(function(o){return o.k===state.tail;})) state.tail=opts[0].k;
  var box=document.getElementById('tailPills');
  box.innerHTML=opts.map(function(o){
    var notation = (dist.type!=='discrete') ? '<span class="math" data-notation="'+o.k+'"></span>' : (o.m?'<span class="math">'+o.m+'</span>':'');
    return '<button class="pill'+(o.k===state.tail?' active':'')+'" data-tail="'+o.k+'">'+o.l+notation+'</button>';
  }).join('');
  Array.from(box.children).forEach(function(b){
    b.addEventListener('click', function(){
      Array.from(box.children).forEach(function(x){x.classList.remove('active');});
      b.classList.add('active'); state.tail=b.getAttribute('data-tail'); render(); saveState();
    });
  });
  if(dist.type!=='discrete') updateTailNotations(distNotationSymbol(state.distKey, readParams(dist)));
}

function distSymbolFor(distKey, params){
  if(distKey==='normal') return (params.mu===0 && params.sigma===1) ? 'Z' : 'X';
  if(distKey==='t') return 'T';
  if(distKey==='chi2') return 'χ²';
  if(distKey==='f') return 'F';
  if(distKey==='binomial'||distKey==='poisson'||distKey==='hyper') return 'X';
  return null;
}
function distNotationSymbol(distKey, params){
  var s=distSymbolFor(distKey, params);
  return (distKey==='t') ? 't' : s;
}
function updateDistLabels(dist, params){
  var sym=distNotationSymbol(state.distKey, params);
  var symHtml = (state.distKey==='t') ? '<span class="btn-sym-t">'+sym+'</span>' : sym;
  var vpBtn=document.getElementById('modeVP'), pvBtn=document.getElementById('modePV');
  if(sym){ vpBtn.innerHTML=symHtml+' → Probabilidad'; pvBtn.innerHTML='Probabilidad → '+symHtml; }
  else{ vpBtn.textContent='Valor → Probabilidad'; pvBtn.textContent='Probabilidad → Valor'; }
  var inputLabel=document.getElementById('inputLabel');
  if(state.mode==='vp'){ inputLabel.textContent = (sym && dist.type!=='discrete') ? ('Valor de '+sym) : dist.valueLabel; }
  else{ inputLabel.textContent='Probabilidad'; }
  if(dist.type!=='discrete') updateTailNotations(sym);
}

function render(){
  var dist=currentDist(), params=readParams(dist);
  var rawStr=(input.value||'').toString().trim();
  var raw=parseFloat(rawStr.replace(',','.'));
  var resultValue=document.getElementById('resultValue');
  var resultFormula=document.getElementById('resultFormula');
  var resultLabel=document.getElementById('resultLabel');

  updateDistLabels(dist, params);

  function clearAll(){
    document.getElementById('curveLine').setAttribute('d','');
    document.getElementById('shadeA').setAttribute('d','');
    document.getElementById('shadeB').setAttribute('d','');
    document.getElementById('barsGroup').innerHTML='';
    document.getElementById('ticks').innerHTML='';
    clearZlines();
  }

  if(params.__incomplete){
    resultLabel.textContent = state.mode==='vp' ? 'PROBABILIDAD' : 'VALOR';
    resultFormula.textContent='Completá los parámetros de arriba';
    resultValue.textContent='—';
    resultValue.className='result-value';
  }

  var perr=validateParams(state.distKey, params);
  if(perr){
    resultLabel.textContent='PARÁMETROS INVÁLIDOS';
    resultFormula.textContent='Corregí los valores de arriba';
    resultValue.textContent=perr;
    resultValue.className='result-value is-error';
    clearAll();
    return;
  }

  if(rawStr===''||isNaN(raw)){
    if(!params.__incomplete){
      resultLabel.textContent = state.mode==='vp' ? 'PROBABILIDAD' : 'VALOR';
      resultFormula.textContent = state.mode==='vp' ? 'Completá el valor de arriba' : 'Completá la probabilidad de arriba';
      resultValue.textContent='—';
      resultValue.className='result-value';
    }
    if(dist.type==='discrete') renderDiscreteChart(dist,params,state.tail,null); else renderContinuousChart(dist,params,state.tail,null);
    return;
  }

  if(state.mode==='vp'){
    var x = dist.type==='discrete' ? Math.round(raw) : raw;
    var p = computeTailProb(dist,params,x,state.tail);
    resultLabel.textContent='PROBABILIDAD';
    resultValue.textContent=fmt(p,4);
    resultValue.classList.remove('is-value','is-error'); resultValue.classList.add('is-prob');
    resultFormula.textContent=formulaText(dist,state.tail);
    if(dist.type==='discrete') renderDiscreteChart(dist,params,state.tail,x); else renderContinuousChart(dist,params,state.tail,x);
  } else {
    if(raw<=0||raw>=1){ resultValue.textContent='p debe estar entre 0 y 1'; return; }
    var val=invertValue(dist,params,raw,state.tail);
    resultLabel.textContent='VALOR';
    var xForChart = dist.type==='discrete' ? Math.round(val) : val;
    resultValue.textContent = dist.type==='discrete' ? Math.round(val) : fmt(val,4);
    resultValue.classList.remove('is-prob','is-error'); resultValue.classList.add('is-value');
    resultFormula.textContent = distNotationSymbol(state.distKey, params);
    if(dist.type==='discrete') renderDiscreteChart(dist,params,state.tail,xForChart); else renderContinuousChart(dist,params,state.tail,xForChart);
  }
}

}
function loadExamSession(){
  try{ var r=localStorage.getItem(EXAM_KEY); return r?JSON.parse(r):null; }catch(e){ return null; }
}
function clearExamSession(){ try{ localStorage.removeItem(EXAM_KEY); }catch(e){} }

function updateAlertsUI(){
  var el=document.getElementById('examAlerts');
  var n=examState.exits.length;
  if(n===0){ el.textContent='Salidas detectadas: 0'; el.classList.remove('warn'); return; }
  var last=examState.exits[n-1];
  el.textContent='Salidas detectadas: '+n+' (última: '+last.ts+')';
  el.classList.add('warn');
}

function logExit(reason){
  if(!exitDetectionEnabled) return;
  var now=Date.now();
  if(now-lastExitLog<1500) return;
  lastExitLog=now;
  var ts=new Date().toLocaleTimeString();
  var entry={ts:ts, start:now, reason:reason||null, durationMs:null};
  examState.exits.push(entry);
  examState.pendingExit=entry;
  updateAlertsUI();
  saveExamSession();
}

function logReturn(){
  var now=Date.now();
  if(!examState.pendingExit) return;
  if(now-lastReturnLog<400) return;
  lastReturnLog=now;
  examState.pendingExit.durationMs=now-examState.pendingExit.start;
  examState.pendingExit=null;
  saveExamSession();
}

function formatDuration(ms){
  if(ms===null||ms===undefined) return 'sin regreso registrado';
  var s=Math.round(ms/1000);
  if(s<60) return 'fuera '+s+' seg';
  var m=Math.floor(s/60), rs=s%60;
  return 'fuera '+m+' min '+rs+' seg';
}
function formatElapsed(ms){
  var s=Math.floor(ms/1000);
  var h=Math.floor(s/3600), m=Math.floor((s%3600)/60), rs=s%60;
  var mm=(m<10?'0':'')+m, ss=(rs<10?'0':'')+rs;
  return h>0 ? (h+':'+mm+':'+ss) : (mm+':'+ss);
}

function isMobileDevice(){
  var uaMobile=/Android|iPhone|iPad|iPod|Mobile|Windows Phone|BlackBerry/i.test(navigator.userAgent||'');
  var touch=('ontouchstart' in window) || (navigator.maxTouchPoints>0);
  return uaMobile || (touch && window.innerWidth<900);
}
function requestFS(){
  if(!isMobileDevice()) return;
  var el=document.documentElement;
  try{
    if(el.requestFullscreen) el.requestFullscreen();
    else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  }catch(e){}
}
function exitFS(){
  try{
    if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen();
    else if(document.webkitFullscreenElement && document.webkitExitFullscreen) document.webkitExitFullscreen();
  }catch(e){}
}

var wakeLock=null;
function requestWakeLock(){
  try{
    if('wakeLock' in navigator){
      navigator.wakeLock.request('screen').then(function(wl){ wakeLock=wl; }).catch(function(){});
    }
  }catch(e){}
}
function releaseWakeLock(){
  try{ if(wakeLock){ wakeLock.release(); wakeLock=null; } }catch(e){}
}

function updateTimer(){
  var t=document.getElementById('examTimer');
  if(examState.startTime){
    var elapsedMs=Date.now()-examState.startTime;
    t.textContent=formatElapsed(elapsedMs);
    if(Math.floor(elapsedMs/1000)%20===0){ requestWakeLock(); }
  }
}

function updateExamToggleButtonText(){
  var btn=document.getElementById('examToggleBtn');
  if(btn) btn.textContent = examState.active ? 'Salir modo examen' : 'Activar modo examen';
}

function showExamActiveScreen(){
  var wrapEl=document.querySelector('.wrap');
  if(wrapEl && wrapEl.parentElement.id!=='examBody'){
    document.getElementById('examBody').appendChild(wrapEl);
  }
  document.getElementById('examOverlay').classList.add('show');
  document.getElementById('examActiveScreen').style.display='flex';
  updateAlertsUI();
  updateTimer();
  requestFS();
  requestWakeLock();
  updateExamToggleButtonText();
  clearInterval(examState.timerInterval);
  examState.timerInterval=setInterval(updateTimer,1000);
}

function dismissOnBackdropClick(modalId){
  var modal=document.getElementById(modalId);
  modal.addEventListener('click', function(e){
    if(e.target===modal){ modal.classList.remove('show'); }
  });
}
dismissOnBackdropClick('examSetupModal');
dismissOnBackdropClick('pinModal');

document.getElementById('examToggleBtn').addEventListener('click', function(){
  if(examState.active){
    document.getElementById('pinModal').classList.add('show');
    document.getElementById('pinInput').value='';
    document.getElementById('pinError').textContent='';
  } else {
    document.getElementById('examSetupModal').classList.add('show');
    document.getElementById('examSetupPin').value='';
    document.getElementById('examSetupError').textContent='';
  }
});

document.getElementById('examSetupConfirm').addEventListener('click', function(){
  var pin=(document.getElementById('examSetupPin').value||'').trim();
  if(!pin){ document.getElementById('examSetupError').textContent='Ingresá un PIN para poder salir después.'; return; }
  examState.pin=pin; examState.exits=[]; examState.startTime=Date.now(); examState.active=true;
  document.getElementById('examSetupModal').classList.remove('show');
  showExamActiveScreen();
  saveExamSession();
  if(isMobileDevice() && !('wakeLock' in navigator)){
    alert('Este celular no puede mantener la pantalla encendida automáticamente durante el examen. Para que no se bloquee sola, andá a Configuración → Pantalla y brillo → Bloqueo automático, y ponelo en "Nunca" mientras dure el examen (después lo podés volver a cambiar).');
  }
});

document.getElementById('pinSubmit').addEventListener('click', function(){
  var v=document.getElementById('pinInput').value;
  if(v===examState.pin || v===MASTER_PIN){ endExam(); }
  else{ document.getElementById('pinError').textContent='PIN incorrecto'; }
});

function endExam(){
  examState.active=false;
  clearInterval(examState.timerInterval);
  releaseWakeLock();
  clearExamSession();
  updateExamToggleButtonText();
  document.getElementById('pinModal').classList.remove('show');
  exitFS();
  var wrapEl=document.getElementById('examBody').firstChild;
  var overlay=document.getElementById('examOverlay');
  if(wrapEl) document.body.insertBefore(wrapEl, overlay);
  overlay.classList.remove('show');
  var n=examState.exits.length;
  var totalMs = examState.startTime ? (Date.now()-examState.startTime) : 0;
  var msg='Modo examen finalizado.\nDuración total: '+formatElapsed(totalMs)+'\nSalidas detectadas: '+n;
  if(n){
    msg+='\n\n'+examState.exits.map(function(e){
      return e.ts+' — '+formatDuration(e.durationMs)+(e.reason?(' ('+e.reason+')'):'');
    }).join('\n');
  }
  alert(msg);
}

var CONFIRM_DELAY=500;
document.addEventListener('visibilitychange', function(){
  if(!examState.active) return;
  if(document.hidden){
    setTimeout(function(){
      if(document.hidden && examState.active) logExit();
    }, CONFIRM_DELAY);
  } else {
    logReturn(); requestWakeLock();
  }
});
window.addEventListener('blur', function(){
  if(!examState.active) return;
  setTimeout(function(){
    if(document.hidden && examState.active) logExit();
  }, CONFIRM_DELAY);
});
window.addEventListener('focus', function(){ if(examState.active) logReturn(); });
document.addEventListener('fullscreenchange', function(){
  if(!examState.active) return;
  if(!document.fullscreenElement){
    setTimeout(function(){
      if(!examState.active) return;
      if(document.hidden){ logExit('salió de pantalla completa'); }
      else if(!document.fullscreenElement){ requestFS(); }
    }, CONFIRM_DELAY);
  }
});
document.addEventListener('webkitfullscreenchange', function(){
  if(!examState.active) return;
  if(!document.webkitFullscreenElement){
    setTimeout(function(){
      if(!examState.active) return;
      if(document.hidden){ logExit('salió de pantalla completa'); }
      else if(!document.webkitFullscreenElement){ requestFS(); }
    }, CONFIRM_DELAY);
  }
});

function persistCloseMarker(){
  if(!examState.active || !exitDetectionEnabled) return;
  saveExamSession(Date.now());
}
window.addEventListener('pagehide', persistCloseMarker);
window.addEventListener('beforeunload', function(e){
  if(!examState.active) return;
  persistCloseMarker();
  e.preventDefault();
  e.returnValue='';
});

(function resumeExamIfPending(){
  var s=loadExamSession();
  if(!s || !s.active) return;
  examState.pin=s.pin; examState.startTime=s.startTime; examState.exits=s.exits||[]; examState.active=true;
  if(s.closedAt && exitDetectionEnabled){
    var gap=Date.now()-s.closedAt;
    examState.exits.push({ts:new Date(s.closedAt).toLocaleTimeString(), start:s.closedAt, reason:'cerró el navegador', durationMs:gap});
  }
  showExamActiveScreen();
  saveExamSession();
})();
</script>
</body>
</html>
